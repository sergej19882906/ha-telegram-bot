# =============================================================================
# HA Telegram Bot — Docker Compose
# Запуск:   docker compose up -d
# Логи:    docker compose logs -f
# Пересборка после обновления: docker compose up -d --build
# =============================================================================

services:
  ha-telegram-bot:
    build: .
    image: ha-telegram-bot:latest
    container_name: ha-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      # Языки пользователей и активные таймеры переживают пересоздание контейнера
      - ha_bot_data:/app/data
    ports:
      # Приёмник уведомлений из HA (NOTIFY_PORT).
      # Если NOTIFY_PORT=0 в .env — удалите или закомментируйте эту строку.
      - "8099:8099"

volumes:
  ha_bot_data:
