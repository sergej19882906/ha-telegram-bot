name: Pylint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pylint

      # --- Блокирующая проверка: только реальные ошибки (E) ---
      # Импорт bot.py в CI безопасен: main() не вызывается,
      # токены и подключение к HA не требуются.
      - name: Pylint — ошибки (fail-on-error)
        run: pylint bot.py --disable=all --enable=E --score=no

      # --- Полный отчёт: предупреждения, стиль, рейтинг ---
      # Informational: не блокирует PR, но показывает, что можно улучшить.
      # Чтобы сделать строже, уберите continue-on-error и задайте порог:
      #   --fail-under=7.0
      - name: Pylint — полный отчёт (informational)
        continue-on-error: true
        run: |
          pylint bot.py --score=y || true   # настройки — в .pylintrc

      # --- Быстрый стиль: неиспользуемые импорты/переменные ---
      # Блокирует, т.к. это почти всегда признак бага или мусора.
      # Примечание: W0613 (unused-argument) намеренно исключён — обработчики
      # python-telegram-bot обязаны принимать (update, context), даже если
      # context не используется (подавляется через .pylintrc для полного отчёта).
      - name: Pylint — unused imports/variables (fail-on-error)
        run: pylint bot.py --disable=all --enable=W0611,W0612 --score=no
